name: Release

# Tag a commit with `v*` (e.g. `v0.1.0`) to cut a release. Two build jobs run
# in parallel — the Pi Zero OS image (Buildroot) and the ESP32-S3 firmware
# image (+ ESP Web Tools manifest) — and a third job publishes every artifact
# to the GitHub Release in one shot.
#
# Manual trigger is also allowed via the Actions tab — useful for regenerating
# an asset without bumping a tag (assets upload as workflow artifacts; the
# Release is only published on a real `v*` tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pi-image:
    name: Build Pi Zero image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # Default ubuntu runners only have ~14GB free; Buildroot needs more.
        # Drop the toolchains we don't use to claw back ~30GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf

      # No rust-cache here: this job must emit the final linked `faraday`
      # binary for the Buildroot image, and a cache restore (shared `key: arm`
      # with ci.yml) can report everything "fresh" without re-linking the
      # executable — leaving the compose bind-mount pointing at nothing. A
      # release is a clean, reproducible build; cold-compile on purpose.
      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cross-compile ARM binary
        working-directory: raspberry-pi
        run: |
          cargo zigbuild --release --target arm-unknown-linux-gnueabihf
          # raspberry-pi is a workspace member, so the binary lands in the
          # workspace-root target dir (../target), not in raspberry-pi/target/.
          test -f ../target/arm-unknown-linux-gnueabihf/release/faraday || {
            echo "::error::ARM binary missing after cross-compile"
            exit 1
          }
          ls -lh ../target/arm-unknown-linux-gnueabihf/release/faraday

      - name: Cache Buildroot downloads + ccache
        uses: actions/cache@v4
        with:
          path: |
            buildroot_dl
            .buildroot-ccache
          key: buildroot-${{ hashFiles('opt/build.sh', 'opt/pi0/**') }}
          restore-keys: |
            buildroot-

      - name: Build Pi OS image (Buildroot via Docker)
        run: docker compose up --exit-code-from build-images

      - name: Hand build outputs back to the runner
        # The Buildroot container writes the download cache, ccache, and image
        # as root into these bind-mounted dirs. Hand ownership back before the
        # cache-save post-step and packaging (both run as the runner user).
        run: |
          sudo chown -R "$(id -u):$(id -g)" buildroot_dl .buildroot-ccache images

      - name: Package release artifacts
        id: pkg
        run: |
          # Strip the leading `v` from a tag like `v0.1.0`; fall back to short SHA
          # for manual workflow_dispatch runs.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          cd images
          IMG="faraday_os.${VERSION}.pi0.img"
          mv faraday_os.pi0.img "${IMG}"
          zip -9 "${IMG}.zip" "${IMG}"
          sha256sum "${IMG}" "${IMG}.zip" > "faraday_os.${VERSION}.sha256.txt"
          ls -lh

      - name: Upload artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: pi-image-assets
          path: |
            images/faraday_os.*.pi0.img.zip
            images/faraday_os.*.sha256.txt
          retention-days: 30

  esp32-image:
    name: Build ESP32-S3 firmware image + manifest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The xtensa toolchain + ESP-IDF build are space-hungry. Reclaim the
        # same ~30GB the Pi job does.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      # Host-stable Rust for `cargo install cargo-espflash` below. The firmware
      # build itself runs on the `esp` channel (esp32-touch2/rust-toolchain.toml),
      # installed by the xtensa-toolchain action next.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install espflash
        run: cargo install cargo-espflash --locked

      # The ESP32-S3 build runs on the `esp` channel (see
      # esp32-touch2/rust-toolchain.toml). Building (not `cargo check`) is
      # required so the nm radar-audit below has a linked ELF to inspect.
      - uses: esp-rs/xtensa-toolchain@v1.5.3
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build + merge flashable image
        working-directory: esp32-touch2
        run: |
          mkdir -p ../images
          # The default ESP-IDF partition table caps the factory app at 1 MB,
          # but the firmware is ~2.4 MB. Our partitions.csv gives it 4 MB.
          # (esp-idf-sys convention: no CONFIG_PARTITION_TABLE_* in
          # sdkconfig.defaults — pass the CSV to espflash instead.)
          cargo espflash save-image --release --merge --skip-padding \
            --chip esp32s3 --flash-size 16mb --partition-table partitions.csv \
            "../images/faraday_esp32-s3.${VERSION}.bin"
          test -f "../images/faraday_esp32-s3.${VERSION}.bin" || {
            echo "::error::merged ESP32-S3 image missing after save-image"
            exit 1
          }
          ls -lh "../images/faraday_esp32-s3.${VERSION}.bin"

      # Air-gap invariant: the WiFi/BT driver stack must NOT be linked into the
      # released firmware. Same chokepoint audit as ci.yml (driver entrypoints,
      # type T), so the property that CDI gates also holds for what users flash.
      - name: nm radio-symbol audit (fail if WiFi/BT driver linked)
        working-directory: esp32-touch2
        run: |
          NM=$(ls "$HOME"/.rustup/toolchains/esp/xtensa-esp-elf/*/xtensa-esp-elf/bin/xtensa-esp32s3-elf-nm | head -1)
          ELF=target/xtensa-esp32s3-espidf/release/faraday-esp32-touch2
          echo "Auditing $ELF"
          HITS=$("$NM" --defined-only "$ELF" \
            | grep -E ' [Tt] .*(esp_wifi_init|esp_wifi_start|esp_wifi_set_mode|esp_bt_controller_init|esp_bt_controller_enable)$' \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::WiFi/BT driver symbols linked into the air-gapped firmware:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no WiFi/BT driver entrypoints linked."

      - name: Emit ESP Web Tools manifest + checksums
        run: |
          cd images
          sha256sum "faraday_esp32-s3.${VERSION}.bin" > "faraday_esp32-s3.${VERSION}.sha256.txt"
          # The manifest's `path` is resolved relative to the manifest URL, so a
          # bare filename works when both sit side by side in the same release.
          cat > "faraday_esp32-s3.${VERSION}.manifest.json" <<EOF
          {
            "name": "Faraday",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "faraday_esp32-s3.${VERSION}.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
          ls -lh

      - name: Upload artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-image-assets
          path: |
            images/faraday_esp32-s3.*.bin
            images/faraday_esp32-s3.*.manifest.json
            images/faraday_esp32-s3.*.sha256.txt
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [pi-image, esp32-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Compute version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: pi-image-assets
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: esp32-image-assets
          path: assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # `**` because upload-artifact v4 preserves the `images/` path prefix
          # inside each artifact, so files land at assets/images/… (and could
          # land at assets/… if that changes) — match either.
          files: |
            assets/**/faraday_os.*.pi0.img.zip
            assets/**/faraday_os.*.sha256.txt
            assets/**/faraday_esp32-s3.*.bin
            assets/**/faraday_esp32-s3.*.manifest.json
            assets/**/faraday_esp32-s3.*.sha256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Faraday ${{ github.ref_name }}

            Pre-built firmware for both device variants, always reproducible
            from this tag.

            ### ESP32-S3 (Waveshare ESP32-S3-Touch-LCD-2)

            Flash it from the browser — no toolchain needed:

            <https://faraday.to/flash>

            Or manually with `esptool`:

            ```
            esptool.py --chip esp32s3 write_flash \
                0x0 faraday_esp32-s3.${{ env.VERSION }}.bin
            ```

            Verify first:

            ```
            shasum -a 256 -c faraday_esp32-s3.${{ env.VERSION }}.sha256.txt
            ```

            The `manifest.json` asset is the ESP Web Tools manifest the `/flash`
            page points at.

            ### Raspberry Pi Zero (SD-card image)

            **Flash with `dd` (macOS / Linux):**

            ```
            unzip faraday_os.${{ env.VERSION }}.pi0.img.zip
            sudo dd if=faraday_os.${{ env.VERSION }}.pi0.img \
                    of=/dev/diskN bs=4m status=progress
            ```

            (Replace `diskN` with your SD card device — find it with
            `diskutil list` on macOS or `lsblk` on Linux.)

            **Windows:** unzip the `.img.zip`, then write the `.img` with
            [Raspberry Pi Imager](https://www.raspberrypi.com/software/) →
            "Use custom image".

            ### Verify before flashing

            ```
            shasum -a 256 -c faraday_os.${{ env.VERSION }}.sha256.txt
            ```

            ### Build it yourself instead

            Faraday is open source. To audit the firmware you flash, build it
            from this exact tag:

            ```
            git checkout ${{ github.ref_name }}
            just image          # Pi OS image
            # or
            cd esp32-touch2 && cargo espflash save-image --release --merge --chip esp32s3 out.bin
            ```

            See [`opt/README.md`](../tree/${{ github.ref_name }}/opt/README.md)
            for the Pi build and [`esp32-touch2`](../tree/${{ github.ref_name }}/esp32-touch2)
            for the ESP32-S3 firmware.